<app-top-header></app-top-header>
  <h1 class="m-4"  style="color: #007bff;">Customers</h1>
<!-- Action Bar -->
  <div class="d-flex justify-content-between mb-3 m-4">
    <div>
      <button class="btn btn-primary btn-sm">Card View</button>
      <button class="btn btn-outline-primary btn-sm">List View</button>
      <button class="btn btn-outline-primary btn-sm">Map View</button>
      <button class="btn btn-outline-success btn-sm">+ New Customer</button>
    </div>
    <div>
      <input
        type="text"
        class="form-control form-control-sm"
        placeholder="Filter:"
        [(ngModel)]="filterText"
      />
    </div>
  </div>
<app-customer-card-view [customers]="filteredCustomers()"></app-customer-card-view>

<div class="container mt-4 customer-list" style="overflow-y: scroll; width: 100%; height: 75%;">
 <!-- Table -->
  <table class="table table-striped table-hover">
    <thead class="thead-light">
      <tr>
        <th>Profile</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>City</th>
        <th>State</th>
        <th>Order Total</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of customers">
        <td>
          <img
            [src]="customer.profilePicture"
            alt="Profile"
            class="profile-pic me-2"
          />
        </td>
        <td>{{ customer.name }}</td>
        <td>{{ customer.email }}</td>
        <td>{{ customer.phone }}</td>
        <td>{{ customer.city }}</td>
        <td>{{ customer.state }}</td>
        <td>${{ customer.orderTotal.toFixed(2) }}</td>
        <td>                         
          <button class="btn btn-sm btn-outline-primary" (click)="openDetails(customer)">Details</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
